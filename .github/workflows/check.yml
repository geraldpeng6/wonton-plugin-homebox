name: 检查

on:
  pull_request:
  push:
    branches: [main]
  # 手动入口：想合并前跑一遍冒烟时，从这里触发（冒烟作业只在 Dependabot 的 PR 和手动触发时跑）。
  workflow_dispatch:
    inputs:
      core-image:
        description: 核心镜像（如 ghcr.io/geraldpeng6/wonton-core:sha-<完整 40 位提交号>，钉在某次合并上复测；留空用套件默认的 :main）
        required: false
        type: string
        default: ''
      upgrade-from:
        description: 冒烟“升级保数据”的起点（提交或 tag，只在本次运行里打本地 tag，不推）；留空取最近的 tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    uses: geraldpeng6/wonton-plugin-template/.github/workflows/plugin-check.yml@9116b57f931b1383cc8dcca176c3d99bb4d394dd
    with:
      # 清单用了 spec 0.11 的 notify（发信变量 WONTON_SMTP_*），套件默认的核心镜像还没有这些能力：
      # 检查用带内部邮箱的核心构建。手动触发给 inputs.core-image 时以它为准。
      core-image: ${{ inputs.core-image || 'ghcr.io/wontonapp/wonton-core:main' }}
      upgrade-from: ${{ inputs.upgrade-from }}
